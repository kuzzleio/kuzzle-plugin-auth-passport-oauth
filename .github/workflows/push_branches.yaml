name: Push checks

# npm trusted publishing: this file name is the one registered as the trusted
# publisher of `kuzzle-plugin-auth-passport-oauth` on npmjs.com. Renaming it,
# or publishing from another workflow, breaks the release.
on:
  push:
    branches:
      - master
      - beta

jobs:
  release:
    name: Release process
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Trusted publishing needs npm >= 11.5.1, shipped with Node.js 24.
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.KUZZLE_BOT_APP_ID }}
          private-key: ${{ secrets.KUZZLE_BOT_PRIVATE_KEY }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SEMANTIC_RELEASE_NPM_PUBLISH: "true"
          SEMANTIC_RELEASE_SLACK_WEBHOOK: ${{ secrets.SEMANTIC_RELEASE_SLACK_WEBHOOK }}
        run: npx semantic-release
